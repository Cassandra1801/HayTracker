spring.application.name=HayTracker

# Aktiver den lokale profil som standard (overskriv med SPRING_PROFILES_ACTIVE ved fx deployment)
spring.profiles.active=local

# Thymeleaf - deaktiver cache under udvikling, s� �ndringer i HTML ses med det samme
spring.thymeleaf.cache=false

# JPA / Hibernate - vi styrer selv skemaet via schema.sql, så Hibernate må ikke lave/ændre tabeller
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Kør schema.sql ved opstart, også selvom det ikke er en indbygget/embedded database (MySQL)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
